name: Habesha Sport News Bot

on:
  schedule:

    # =====================================================
    # GENERAL — every 6 minutes, starting at :00
    # =====================================================
    - cron: "0,6,12,18,24,30,36,42,48,54 * * * *"

    # =====================================================
    # ARSENAL — every 6 minutes, starting at :01
    # =====================================================
    - cron: "1,7,13,19,25,31,37,43,49,55 * * * *"

    # =====================================================
    # LIVERPOOL — every 6 minutes, starting at :02
    # =====================================================
    - cron: "2,8,14,20,26,32,38,44,50,56 * * * *"

    # =====================================================
    # MAN CITY — every 6 minutes, starting at :03
    # =====================================================
    - cron: "3,9,15,21,27,33,39,45,51,57 * * * *"

    # =====================================================
    # CHELSEA — every 6 minutes, starting at :04
    # =====================================================
    - cron: "4,10,16,22,28,34,40,46,52,58 * * * *"

    # =====================================================
    # MAN UNITED — every 6 minutes, starting at :05
    # =====================================================
    - cron: "5,11,17,23,29,35,41,47,53,59 * * * *"

  workflow_dispatch:

permissions:
  contents: write


# =========================================================
# IMPORTANT
#
# All scheduled runs use the same Telegram USER_SESSION.
# Therefore all schedules share ONE concurrency group.
# =========================================================

concurrency:
  group: habesha-sport-bot
  cancel-in-progress: false


jobs:

  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # DOWNLOAD BOT FILES
      # ===================================================

      - name: Download bot files
        uses: actions/checkout@v4


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ===================================================
      # CACHE NLLB
      # ===================================================

      - name: Cache NLLB model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-amharic-600m-${{ runner.os }}-v1


      # ===================================================
      # INSTALL REQUIREMENTS
      # ===================================================

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ===================================================
      # CHECK FACEBOOK SECRETS
      # ===================================================

      - name: Check Facebook secrets
        env:
          FB_ETHIO_SPORT_PAGE_ID: ${{ secrets.FB_ETHIO_SPORT_PAGE_ID }}
          FB_ETHIO_SPORT_PAGE_TOKEN: ${{ secrets.FB_ETHIO_SPORT_PAGE_TOKEN }}

          FB_ARSENAL_PAGE_ID: ${{ secrets.FB_ARSENAL_PAGE_ID }}
          FB_ARSENAL_PAGE_TOKEN: ${{ secrets.FB_ARSENAL_PAGE_TOKEN }}

        run: |

          if [ -n "$FB_ETHIO_SPORT_PAGE_ID" ]; then
            echo "✅ Ethio Sport Page ID is configured"
          else
            echo "❌ Ethio Sport Page ID is MISSING"
          fi

          if [ -n "$FB_ETHIO_SPORT_PAGE_TOKEN" ]; then
            echo "✅ Ethio Sport Page Token is configured"
          else
            echo "❌ Ethio Sport Page Token is MISSING"
          fi

          if [ -n "$FB_ARSENAL_PAGE_ID" ]; then
            echo "✅ Arsenal Page ID is configured"
          else
            echo "❌ Arsenal Page ID is MISSING"
          fi

          if [ -n "$FB_ARSENAL_PAGE_TOKEN" ]; then
            echo "✅ Arsenal Page Token is configured"
          else
            echo "❌ Arsenal Page Token is MISSING"
          fi


      # ===================================================
      # RUN BOT
      # ===================================================

      - name: Run Telegram bot
        env:

          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USER_SESSION: ${{ secrets.USER_SESSION }}

          FB_ETHIO_SPORT_PAGE_ID: ${{ secrets.FB_ETHIO_SPORT_PAGE_ID }}
          FB_ETHIO_SPORT_PAGE_TOKEN: ${{ secrets.FB_ETHIO_SPORT_PAGE_TOKEN }}

          FB_ARSENAL_PAGE_ID: ${{ secrets.FB_ARSENAL_PAGE_ID }}
          FB_ARSENAL_PAGE_TOKEN: ${{ secrets.FB_ARSENAL_PAGE_TOKEN }}

          # GitHub automatically provides the exact
          # cron expression that triggered this run.
          BOT_SCHEDULE: ${{ github.event.schedule }}

        run: |
          python -u github_bot.py


      # ===================================================
      # SAVE STATE
      # ===================================================

      - name: Save bot state
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then

            echo "No state changes"

          else

            git commit -m "Update bot state"

            git pull --rebase origin main

            git push origin main

          fi
