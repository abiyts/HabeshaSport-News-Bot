name: Habesha Sport News Bot

on:
  schedule:
    # General — every 5 minutes, starting at :00
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"

    # Arsenal — every 5 minutes, starting at :01
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

    # Liverpool — every 5 minutes, starting at :02
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

    # Man City — every 5 minutes, starting at :03
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

    # Chelsea — every 5 minutes, starting at :04
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

    # Man United — every 5 minutes, starting at :05
    - cron: "5,10,15,20,25,30,35,40,45,50,55 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# IMPORTANT:
# All scheduled runs use the same Telegram USER_SESSION.
# Therefore all schedules must share ONE concurrency group.
concurrency:
  group: habesha-sport-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download bot files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the NLLB model so GitHub does not download ~2.5 GB
      # again on every 5-minute workflow run.
      - name: Cache NLLB model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-amharic-600m-${{ runner.os }}-v1

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Facebook secrets
        env:
          FB_ETHIO_SPORT_PAGE_ID: ${{ secrets.FB_ETHIO_SPORT_PAGE_ID }}
          FB_ETHIO_SPORT_PAGE_TOKEN: ${{ secrets.FB_ETHIO_SPORT_PAGE_TOKEN }}
          FB_ARSENAL_PAGE_ID: ${{ secrets.FB_ARSENAL_PAGE_ID }}
          FB_ARSENAL_PAGE_TOKEN: ${{ secrets.FB_ARSENAL_PAGE_TOKEN }}
        run: |
          if [ -n "$FB_ETHIO_SPORT_PAGE_ID" ]; then
            echo "✅ Ethio Sport Page ID is configured"
          else
            echo "❌ Ethio Sport Page ID is MISSING"
          fi

          if [ -n "$FB_ETHIO_SPORT_PAGE_TOKEN" ]; then
            echo "✅ Ethio Sport Page Token is configured"
          else
            echo "❌ Ethio Sport Page Token is MISSING"
          fi

          if [ -n "$FB_ARSENAL_PAGE_ID" ]; then
            echo "✅ Arsenal Page ID is configured"
          else
            echo "❌ Arsenal Page ID is MISSING"
          fi

          if [ -n "$FB_ARSENAL_PAGE_TOKEN" ]; then
            echo "✅ Arsenal Page Token is configured"
          else
            echo "❌ Arsenal Page Token is MISSING"
          fi

      - name: Run Telegram bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USER_SESSION: ${{ secrets.USER_SESSION }}

          FB_ETHIO_SPORT_PAGE_ID: ${{ secrets.FB_ETHIO_SPORT_PAGE_ID }}
          FB_ETHIO_SPORT_PAGE_TOKEN: ${{ secrets.FB_ETHIO_SPORT_PAGE_TOKEN }}

          FB_ARSENAL_PAGE_ID: ${{ secrets.FB_ARSENAL_PAGE_ID }}
          FB_ARSENAL_PAGE_TOKEN: ${{ secrets.FB_ARSENAL_PAGE_TOKEN }}

          BOT_SCHEDULE: ${{ github.event.schedule }}

        run: |
          python -u github_bot.py

      - name: Save bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update bot state"
            git pull --rebase origin main
            git push origin main
          fi
